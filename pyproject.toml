[project]
name = "ssisbliss"
version = "0.2.0"
description = "SSIS deploys that never overwrite your colleagues' work, and SQL Agent nightly loads explained. For people and AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyodbc>=5.0", "sqlglot>=30,<31"]
authors = [{ name = "Samnor" }]
keywords = ["ssis", "ssisdb", "sql-server", "sql-agent", "deployment", "etl", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Samnor/ssisbliss"
Documentation = "https://github.com/Samnor/ssisbliss/tree/main/docs"
Issues = "https://github.com/Samnor/ssisbliss/issues"

[project.scripts]
ssisbliss = "ssisbliss.ssis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssisbliss"]

# The source archive is the package, its tests and docs. lab/ (AWS lab automation, local state)
# and climb/ (agent evaluation) stay in the repository only.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# `pytest` is the quick loop while you work; CI runs everything: pytest -m "slow or not slow".
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not slow"'
markers = ["slow: the model checker and the climb's solvable-scenario tests (about two minutes)"]

[tool.pyright]
venvPath = "."
venv = ".venv"


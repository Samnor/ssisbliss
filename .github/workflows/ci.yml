name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/privacy_check.py --all

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Installed wheel runs
        run: |
          uv venv /tmp/v
          uv pip install --python /tmp/v/bin/python dist/*.whl
          /tmp/v/bin/onprem-ssis --help > /dev/null
          /tmp/v/bin/onprem-agent --help > /dev/null
          /tmp/v/bin/onprem-ssis install-skill --print | grep -q "name: ssisbliss"
